# Reverse proxy / load balancer in front of the calculator-api replicas.

# Docker's embedded DNS. Re-resolving every 10s means nginx picks up new replica
# IPs after a redeploy without needing a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # nginx's own liveness probe (used by the Compose health check)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        # Using a variable forces runtime DNS resolution; the service name
        # resolves to all replicas, which nginx uses round-robin.
        set $calculator_api http://calculator-api:8080;
        proxy_pass $calculator_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_next_upstream   error timeout http_502 http_503;

        # Shows which replica served the request (handy for the demo)
        add_header X-Upstream-Server $upstream_addr always;
    }
}
