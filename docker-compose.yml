# Full stack: Nginx reverse proxy -> 2 replicas of the calculator API.
#   docker compose up -d --build     (from a fresh clone; builds the image locally)
# Jenkins sets DOCKERHUB_USER / IMAGE_TAG / HOST_PORT to deploy the image it just pushed.

name: calculator-devops

services:
  calculator-api:
    image: ${DOCKERHUB_USER:-local}/calculator-api:${IMAGE_TAG:-latest}
    build:
      context: .
    deploy:
      replicas: 2
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      APP_ENV: docker
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Xms64m"
      TZ: Asia/Kolkata
    networks:
      - calculator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Asia/Kolkata
    depends_on:
      calculator-api:
        condition: service_healthy
    networks:
      - calculator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  calculator-net:
    driver: bridge
